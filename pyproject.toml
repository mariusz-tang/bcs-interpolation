[project]
name = "bcsi"
version = "0"
description = "Extension of Blended Chart Surfaces to sequences with correspondences."
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy>=2.4.6",
    "open3d>=0.19.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
  "coverage>=7.14.1",
  "pybind11-stubgen>=2.5.5",
  "pytest>=9.0.3",
  "ty>=0.0.44",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
command_line = "-m pytest"
source = ["src/"]

[tool.coverage.report]
skip_empty = true
skip_covered = true

[tool.coverage.html]
skip_empty = true
skip_covered = true

[tool.pytest]
addopts = ["--import-mode=importlib"]
strict = true

[tool.ruff.lint]
select = [
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90",  # mccabe
  "D",  # pydocstyle
  "E",  # pycodestyle error
  "F",  # pyflakes
  "FURB",  # refurb
  "I",  # isort
  "N",  # pep8-naming
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "TRY",  # tryceratops
  "UP",  # pyupgrade
  "W",  # pycodestyle warning
]
ignore = ["TRY003"]  # long error messages
pydocstyle.convention = "pep257"
per-file-ignores = { "tests/**/*" = ["D"] }
flake8-annotations.allow-star-arg-any = true
